# Builds the Windows bundle (windows/build.py: PyInstaller with gvsbuild's
# GTK 3, no MSYS2) and publishes it as the release "windows-<branch>"
# (slashes in the branch name become "-"), which install.ps1 downloads.
name: Windows build

on:
  push:
    # Branches only: the tags this workflow moves must not start it again.
    branches: ["**"]
    paths:
      - "**.py"
      - "*.svg"
      - "requirements.txt"
      - "install.ps1"
      - "uninstall.ps1"
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
  schedule:
    # Weekly, so the bundle picks up changes of chemotionapi (version-3).
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The Python of gvsbuild's PyGObject wheel (GTK_RELEASE in windows/build.py).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/cache@v4
        with:
          path: build/windows/download/GTK3_*.zip
          key: gvsbuild-${{ hashFiles('windows/build.py') }}

      - name: Build
        run: python windows/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ChemAssistent-windows-x64
          path: dist/ChemAssistent-windows-x64.zip

      - name: Publish the release windows-<branch>
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="windows-${GITHUB_REF_NAME//\//-}"
          # The tag points to a commit on top of the branch whose install.ps1
          # installs this branch by default, so that
          # raw.githubusercontent.com/<repo>/windows-<branch>/install.ps1 does.
          # Built with plumbing in a separate index: the working tree (CRLF on
          # Windows) stays out of it.
          git show HEAD:install.ps1 > "$RUNNER_TEMP/install.ps1"
          python - "$RUNNER_TEMP/install.ps1" "$GITHUB_REF_NAME" <<'EOF'
          import sys
          path, ref = sys.argv[1], sys.argv[2]
          line = b"$DefaultRef = 'main'"
          text = open(path, "rb").read()
          if text.count(line) != 1:
              sys.exit(f"install.ps1 must contain the line {line!r} exactly once")
          quoted = ref.replace("'", "''").encode()
          open(path, "wb").write(text.replace(line, b"$DefaultRef = '" + quoted + b"'"))
          EOF
          blob=$(git hash-object -w "$RUNNER_TEMP/install.ps1")
          export GIT_INDEX_FILE="$RUNNER_TEMP/tag-index"
          git read-tree HEAD
          git update-index --cacheinfo "100644,$blob,install.ps1"
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          commit=$(git rev-parse HEAD)
          if [ "$tree" != "$(git rev-parse 'HEAD^{tree}')" ]; then
            commit=$(git -c user.name="github-actions[bot]" \
              -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
              commit-tree "$tree" -p HEAD -m "install.ps1 for the branch $GITHUB_REF_NAME")
          fi
          git tag -f "$tag" "$commit"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/ChemAssistent-windows-x64.zip --clobber
          else
            flags=()
            [ "$GITHUB_REF_NAME" = main ] || flags=(--prerelease)
            gh release create "$tag" dist/ChemAssistent-windows-x64.zip "${flags[@]}" \
              --title "Windows build ($GITHUB_REF_NAME)" \
              --notes "Built automatically from the branch $GITHUB_REF_NAME and replaced on every build. Install with install.ps1 (see the README)."
          fi
