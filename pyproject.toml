[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chemassistent"
version = "0.1.0"
description = "Headless Python interface for ChemAssistent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["chemotion-api>=312,<500"]

[project.optional-dependencies]
# PDF text and page images for read_file/grep/view_page (documents.py).
pdf = ["pypdfium2>=4.30,<6"]

[tool.setuptools]
packages = ["chemassistent"]
package-dir = {chemassistent = "."}

[tool.setuptools.package-data]
chemassistent = ["reference/*.md"]
